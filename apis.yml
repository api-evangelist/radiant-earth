aid: radiant-earth

name: Radiant Earth

description: Radiant Earth is a 501(c)(3) non-profit working to increase shared understanding of our world by making data easier to access and
  use. Its initiatives include Source Cooperative, a data publishing utility for the web that lets trusted organizations and individuals publish
  data of any kind at any scale, and the Cloud-Native Geospatial Forum (CNG), which convenes vendor-neutral events and education for geospatial
  data practitioners. Through its GitHub organization (radiantearth) it stewards open geospatial specifications such as the SpatioTemporal Asset
  Catalog (STAC) API spec, and it provides fiscal sponsorship and support services to aligned data initiatives.

